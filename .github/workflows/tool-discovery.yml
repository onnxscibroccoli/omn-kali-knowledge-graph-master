name: Repository Tool Discovery

on:
  pull_request:
    paths:
      - "tools/discovery/**"
      - ".github/workflows/tool-discovery.yml"
  push:
    branches: [main]
    paths:
      - "tools/discovery/**"
      - ".github/workflows/tool-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out knowledge graph
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"

      - name: Prepare workspace
        run: mkdir -p .discovery/repos .discovery/output

      - name: Clone public repositories in declared scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          scope = json.loads(pathlib.Path('tools/discovery/discovery_scope.json').read_text())
          root = pathlib.Path('.discovery/repos')
          skipped = []
          for item in scope['repositories']:
              if not item.get('enabled', True):
                  continue
              repo = item['repository']
              if item.get('access') != 'public':
                  skipped.append(repo)
                  continue
              name = repo.split('/', 1)[1]
              target = root / name
              subprocess.run([
                  'git', 'clone', '--depth', '1',
                  f'https://x-access-token:{os.environ["GH_TOKEN"]}@github.com/{repo}.git',
                  str(target)
              ], check=True)
          pathlib.Path('.discovery/output/private-not-scanned.json').write_text(
              json.dumps({'status': 'NOT_SCANNED', 'repositories': sorted(skipped)}, indent=2) + '\n'
          )
          PY

      - name: Run recursive discovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          scope = json.loads(pathlib.Path('tools/discovery/discovery_scope.json').read_text())
          engine = pathlib.Path('tools/discovery/discovery_engine.py')
          entries = []
          scanned = []
          for item in scope['repositories']:
              if not item.get('enabled', True) or item.get('access') != 'public':
                  continue
              repo = item['repository']
              name = repo.split('/', 1)[1]
              root = pathlib.Path('.discovery/repos') / name
              sha = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              found = subprocess.check_output([
                  'python', str(engine), str(root),
                  '--repository', repo, '--ref', 'HEAD', '--source-sha', sha
              ], text=True)
              entries.extend(json.loads(found))
              scanned.append({'repository': repo, 'sha': sha})

          registry = {
              'schema_version': 'omnikali.tool-registry/v1',
              'status': 'GENERATED',
              'authority': 'omn-kali-knowledge-graph-master',
              'execution_authority': 'none',
              'entries': sorted(entries, key=lambda x: (x['repository'], x['path'])),
              'repositories_scanned': scanned,
              'notes': 'Generated by GitHub Actions from declared public repository scope. Discovery does not grant execution authority.'
          }
          pathlib.Path('.discovery/output/tool_registry.json').write_text(json.dumps(registry, indent=2) + '\n')
          print(f"discovered {len(entries)} tool candidates")
          PY

      - name: Validate registry against adjacent schema
        run: python tools/discovery/validate_registry.py tools/discovery/tool_manifest.schema.json .discovery/output/tool_registry.json

      - name: Render knowledge graph narrative
        run: python tools/discovery/render_narrative.py .discovery/output/tool_registry.json .discovery/output/OMNIKALI_SYSTEM_TOOL_DISCOVERY_NARRATIVE.txt

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: omnikali-tool-discovery-${{ github.sha }}
          path: .discovery/output/
          if-no-files-found: error
          retention-days: 14
