name: Universal goals self-test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-goals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/goals.py validate
      - run: python scripts/render_goals.py --check
      - run: python scripts/validate_schema.py
      - run: git diff --check
